# NBE AI demos on GB10. See PLAN.md for the full architecture.
#
# Networks:
#   nbe-edge  - the only network with a published port (gateway :${NBE_PORT})
#   nbe-core  - internal: true, no route out. Every app, data and model service lives here,
#               which is what makes the demo offline by construction.
#
# Model servers (vLLM, ASR, TTS, SDXL) are added in Phase 1 with restart: "no" and
# compose profiles (core / quality / voice / image / hero).

name: nbe

x-demo-api: &demo-api
  image: nbe-demo-api:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file: .env
  environment: &demo-env
    POSTGRES_HOST: nbe-postgres
    QDRANT_URL: http://nbe-qdrant:6333
    LLM_GATEWAY_URL: http://nbe-llmgw:4000/v1
    RERANK_URL: http://nbe-rerank:8000
    MOCKBANK_URL: http://nbe-mockbank:8000
    GUARDRAILS_URL: http://nbe-guardrails:8000
    DOCLING_URL: http://nbe-docling:8000
    HF_HUB_OFFLINE: "1"
  networks: [nbe-core]
  volumes:
    - ./data:/data:ro          # seeds and generated synthetic data (PLAN.md Phase 3)
  depends_on:
    nbe-postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 10s

x-vllm: &vllm
  image: nvcr.io/nvidia/vllm:26.05-py3
  restart: "no"          # model servers never auto-start at boot (shared GB10, see PLAN.md §6)
  ipc: host
  shm_size: 16g
  networks: [nbe-core]
  environment:
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    VLLM_NO_USAGE_STATS: "1"
    DO_NOT_TRACK: "1"
  volumes:
    - ${MODELS_DIR:-/opt/models}:/models:ro
    - nbe-vllm-cache:/root/.cache
  deploy:
    resources:
      reservations:
        devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
    interval: 15s
    timeout: 5s
    retries: 80
    start_period: 900s

services:
  # ---------------------------------------------------------------- edge
  nbe-gateway:
    image: caddy:2.11-alpine
    container_name: nbe-gateway
    restart: unless-stopped
    ports:
      - "${NBE_PORT:-8200}:80"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [nbe-edge, nbe-core]
    depends_on: [nbe-portal]

  nbe-portal:
    build:
      context: .
      dockerfile: docker/portal/Dockerfile
    image: nbe-portal:${IMAGE_TAG:-latest}
    container_name: nbe-portal
    restart: unless-stopped
    networks: [nbe-core]

  # ---------------------------------------------------------------- shared data
  nbe-postgres:
    image: postgres:16-alpine
    container_name: nbe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nbe
      POSTGRES_USER: nbe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Africa/Cairo}
    volumes:
      - nbe-postgres:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [nbe-core]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nbe -d nbe"]
      interval: 10s
      timeout: 5s
      retries: 10

  nbe-qdrant:
    image: qdrant/qdrant:latest
    container_name: nbe-qdrant
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - nbe-qdrant:/qdrant/storage
    networks: [nbe-core]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- model serving (PLAN.md §5)
  # Started one after another (depends_on healthy) because vLLM sizes its KV cache from the
  # memory that is free at start time. --gpu-memory-utilization is a fraction of the 128 GB pool.
  nbe-llm:
    <<: *vllm
    container_name: nbe-llm
    profiles: [core]
    command:
      - vllm
      - serve
      - /models/gemma-4-26B-A4B-it
      - --served-model-name=gemma-4-26b-a4b
      - --quantization=fp8
      - --max-model-len=32768
      - --max-num-seqs=4
      - --max-num-batched-tokens=8192
      - --gpu-memory-utilization=${NBE_LLM_GPU_UTIL:-0.30}
      - --enable-auto-tool-choice
      - --tool-call-parser=gemma4
      - --limit-mm-per-prompt={"image":4}
      - --host=0.0.0.0
      - --port=8000


  nbe-embed:
    <<: *vllm
    container_name: nbe-embed
    profiles: [core]
    depends_on: { nbe-llm: { condition: service_healthy } }
    command:
      - vllm
      - serve
      - /models/bge-m3
      - --served-model-name=bge-m3
      - --runner=pooling
      - --max-model-len=8192
      - --gpu-memory-utilization=${NBE_EMBED_GPU_UTIL:-0.05}
      - --host=0.0.0.0
      - --port=8000

  nbe-rerank:
    <<: *vllm
    container_name: nbe-rerank
    profiles: [core]
    depends_on: { nbe-embed: { condition: service_healthy } }
    command:
      - vllm
      - serve
      - /models/bge-reranker-v2-m3
      - --served-model-name=bge-reranker-v2-m3
      - --runner=pooling
      - --max-model-len=8192
      - --gpu-memory-utilization=${NBE_RERANK_GPU_UTIL:-0.05}
      - --host=0.0.0.0
      - --port=8000



  nbe-llm-q:
    <<: *vllm
    container_name: nbe-llm-q
    profiles: [quality]
    command:
      - vllm
      - serve
      - /models/Gemma-4-31B-IT-NVFP4
      - --served-model-name=gemma-4-31b
      - --kv-cache-dtype=fp8
      - --max-model-len=16384
      - --max-num-seqs=2
      - --max-num-batched-tokens=8192
      - --gpu-memory-utilization=${NBE_LLMQ_GPU_UTIL:-0.33}
      - --limit-mm-per-prompt={"image":0}
      - --host=0.0.0.0
      - --port=8000



  nbe-hero:
    <<: *vllm
    container_name: nbe-hero
    profiles: [hero]     # exclusive: `make hero` stops quality, voice and image first (PLAN.md §5)
    command:
      - vllm
      - serve
      - /models/gpt-oss-120b
      - --served-model-name=gpt-oss-120b
      - --max-model-len=16384
      - --max-num-seqs=2
      - --max-num-batched-tokens=4096
      # vLLM overrides gpt-oss graph capture to 1024 tokens and its graph-memory estimate swung
      # 3.4 -> 7.3 GiB between runs, leaving no KV cache. Single-user demo: small graphs are enough.
      - '--compilation-config={"max_cudagraph_capture_size": 16}'
      - --gpu-memory-utilization=${NBE_HERO_GPU_UTIL:-0.575}
      - --enable-auto-tool-choice
      - --tool-call-parser=openai
      - --reasoning-parser=openai_gptoss
      - --host=0.0.0.0
      - --port=8000


  # ---------------------------------------------------------------- Arabic gate references (profile: eval)
  nbe-ref-qwen:
    <<: *vllm
    container_name: nbe-ref-qwen
    profiles: [eval]
    command:
      - vllm
      - serve
      - /models/Qwen2.5-14B-Instruct
      - --served-model-name=qwen2.5-14b
      - --max-model-len=8192
      - --max-num-seqs=2
      - --gpu-memory-utilization=0.30
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
      - --host=0.0.0.0
      - --port=8000

  nbe-ref-mistral:
    <<: *vllm
    container_name: nbe-ref-mistral
    profiles: [eval]
    command:
      - vllm
      - serve
      - /models/Mistral-7B-Instruct-v0.3
      - --served-model-name=mistral-7b
      - --max-model-len=8192
      - --max-num-seqs=2
      - --gpu-memory-utilization=0.20
      - --enable-auto-tool-choice
      - --tool-call-parser=mistral
      - --host=0.0.0.0
      - --port=8000

  # ---------------------------------------------------------------- speech + image (on demand)
  nbe-asr:
    build:
      context: .
      dockerfile: docker/gpu-python/Dockerfile
      args: { SERVICE: asr }
    image: nbe-asr:${IMAGE_TAG:-latest}
    container_name: nbe-asr
    profiles: [voice]
    restart: "no"
    environment:
      HF_HOME: /hf
    volumes:
      - ${HF_CACHE_DIR:-/opt/huggingface-cache}:/hf:ro
    networks: [nbe-core]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  nbe-tts:
    build:
      context: .
      dockerfile: docker/tts/Dockerfile
    image: nbe-tts:${IMAGE_TAG:-latest}
    container_name: nbe-tts
    profiles: [voice]
    restart: "no"
    volumes:
      - ${MODELS_DIR:-/opt/models}/piper-voices:/models/piper-voices:ro
    networks: [nbe-core]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  nbe-sdxl:
    build:
      context: .
      dockerfile: docker/gpu-python/Dockerfile
      args: { SERVICE: sdxl }
    image: nbe-sdxl:${IMAGE_TAG:-latest}
    container_name: nbe-sdxl
    profiles: [image]
    restart: "no"
    volumes:
      - ${MODELS_DIR:-/opt/models}/sdxl-base-1.0:/models/sdxl-base-1.0:ro
    networks: [nbe-core]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s

  # ---------------------------------------------------------------- model gateway
  nbe-llmgw:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: nbe-llmgw
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"    # offline: do not fetch the cost map at start
      LITELLM_TELEMETRY: "False"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      NBE_HERO_MODEL: hosted_vllm/gpt-oss-120b      # the model name nbe-hero serves (config/litellm.yaml, alias hero)
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
    networks: [nbe-core]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------- shared services
  nbe-mockbank:
    <<: *demo-api
    build:
      context: .
      dockerfile: docker/demo-api/Dockerfile
      args: { SERVICE: mockbank }
    image: nbe-mockbank:${IMAGE_TAG:-latest}
    container_name: nbe-mockbank
    environment: { <<: *demo-env, DEMO_ID: mockbank }

  nbe-guardrails:
    build:
      context: .
      dockerfile: docker/guardrails/Dockerfile
    image: nbe-guardrails:${IMAGE_TAG:-latest}
    container_name: nbe-guardrails
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      HF_HUB_OFFLINE: "1"
    volumes:
      - ./config/guardrails:/config:ro
    networks: [nbe-core]
    depends_on: [nbe-llmgw]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  nbe-docling:
    build:
      context: .
      dockerfile: docker/docling/Dockerfile
    image: nbe-docling:${IMAGE_TAG:-latest}
    container_name: nbe-docling
    restart: unless-stopped
    networks: [nbe-core]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  nbe-eval:
    <<: *demo-api
    build:
      context: .
      dockerfile: docker/demo-api/Dockerfile
      args: { SERVICE: eval }
    image: nbe-eval:${IMAGE_TAG:-latest}
    container_name: nbe-eval
    environment: { <<: *demo-env, DEMO_ID: eval }
    volumes:
      - ./eval/arabic_gate:/eval:ro

  # ---------------------------------------------------------------- tools (run on demand)
  nbe-datagen:
    build:
      context: .
      dockerfile: docker/datagen/Dockerfile
    image: nbe-datagen:${IMAGE_TAG:-latest}
    container_name: nbe-datagen
    profiles: [tools]
    env_file: .env
    environment:
      POSTGRES_HOST: nbe-postgres
      LLM_GATEWAY_URL: http://nbe-llmgw:4000/v1
    volumes:
      - ./data:/repo/data
    networks: [nbe-core]

  # ---------------------------------------------------------------- demo APIs (one per use case)
  nbe-d1:
    <<: *demo-api
    build:
      context: .
      dockerfile: docker/demo-api/Dockerfile
      args: { SERVICE: d1_docverify }
    image: nbe-d1:${IMAGE_TAG:-latest}
    container_name: nbe-d1
    environment: { <<: *demo-env, DEMO_ID: d1 }
    volumes:
      - ./data:/data:ro
      - ./data/uploads/d1:/data/uploads/d1      # documents uploaded for review: they stay on this machine

  nbe-d2:
    <<: *demo-api
    build:
      context: .
      dockerfile: docker/demo-api/Dockerfile
      args: { SERVICE: d2_chatdoc }
    image: nbe-d2:${IMAGE_TAG:-latest}
    container_name: nbe-d2
    environment: { <<: *demo-env, DEMO_ID: d2 }

  nbe-d3:
    <<: *demo-api
    build:
      context: .
      dockerfile: docker/demo-api/Dockerfile
      args: { SERVICE: d3_campaigns }
    image: nbe-d3:${IMAGE_TAG:-latest}
    container_name: nbe-d3
    environment: { <<: *demo-env, DEMO_ID: d3 }
    volumes:
      - ./data:/data:ro
      - ./data/generated/d3/banners:/data/generated/d3/banners   # cached banner mock-ups (written by /admin/banners)

  nbe-d4:
    <<: *demo-api
    build:
      context: .
      dockerfile: docker/demo-api/Dockerfile
      args: { SERVICE: d4_agent }
    image: nbe-d4:${IMAGE_TAG:-latest}
    container_name: nbe-d4
    environment: { <<: *demo-env, DEMO_ID: d4 }

  nbe-d5:
    <<: *demo-api
    build:
      context: .
      dockerfile: docker/demo-api/Dockerfile
      args: { SERVICE: d5_legal }
    image: nbe-d5:${IMAGE_TAG:-latest}
    container_name: nbe-d5
    # D5_REDUCE_ALIAS=quality puts the reduce step on the 31B (make quality-on); default workhorse
    environment: { <<: *demo-env, DEMO_ID: d5, D5_REDUCE_ALIAS: "${D5_REDUCE_ALIAS:-workhorse}" }

  nbe-d6:
    <<: *demo-api
    build:
      context: .
      dockerfile: docker/demo-api/Dockerfile
      args: { SERVICE: d6_assistant }
    image: nbe-d6:${IMAGE_TAG:-latest}
    container_name: nbe-d6
    environment: { <<: *demo-env, DEMO_ID: d6 }

  nbe-d7:
    <<: *demo-api
    build:
      context: .
      dockerfile: docker/demo-api/Dockerfile
      args: { SERVICE: d7_complaints }
    image: nbe-d7:${IMAGE_TAG:-latest}
    container_name: nbe-d7
    environment: { <<: *demo-env, DEMO_ID: d7 }

networks:
  nbe-edge:
    name: nbe-edge
  nbe-core:
    name: nbe-core
    internal: true

volumes:
  nbe-postgres:
  nbe-qdrant:
  nbe-vllm-cache:
