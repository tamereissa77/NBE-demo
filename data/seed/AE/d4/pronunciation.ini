# How the D4 voice says banking terms: the listen button on each message and spoken replies.
#
#   written form = how it should be spoken
#
# One term per line, under the language of the sentence it appears in: a reply that is mostly Arabic
# uses [ar], an English one uses [en]. Terms in CAPITALS are acronyms and match exactly (OTP, not otp);
# other Latin-letter terms match in any case (debit, Debit). Both also match when glued to an Arabic prefix
# (الOTP), so in [ar] spell acronyms by sound rather than translating them: a translation after the prefix
# (ال + ماكينة الصراف) or beside the same word (رسالة SMS) reads wrong. Longer terms win over shorter ones.
# Edit and save: the next spoken message uses the new file, no restart needed.
#
# Numbers need no entries here (services/d4_agent/app/speech.py): in Arabic, amounts of money are spelled
# out in words (the voice is Egyptian, so 500 is خمسميت); a half, a quarter and three quarters are said ونص، وربع،
# وتلات أرباع (2.5 مليون, 22.5%); % is في المية; card endings, one-time codes, ticket and handoff numbers
# and phone numbers are read digit by digit.
#
# Diacritics written in [ar] have no effect: the voice deletes them. To fix how a word is vowelled, put the
# word in [diacritics] near the end of this file; for a ق said as a hamza, add it to [careful] as well.

[ar]
# Codes and security
OTP = أو تي بي
CVV = سي في في
SMS = إس إم إس
KYC = كي واي سي

# Channels and cards. The voice skips an English word in brackets, so card types are spelled by sound
ATM = إيه تي إم
POS = بي أو إس
debit card = ديبت كارد
credit card = كريدت كارد
prepaid card = بري بيد كارد
debit = ديبت كارد
credit = كريدت كارد
prepaid = بري بيد كارد
Visa = فيزا
Mastercard = ماستر كارد

# Accounts and transfers
IBAN = آيبان
SWIFT = سويفت
UAE PASS = يو إيه إي باس
Aani = آني

# Money
AED = درهم
USD = دولار
EUR = يورو
د.إ = درهم

[en]
# Codes and security
OTP = O T P
CVV = C V V
SMS = S M S
KYC = K Y C

# Channels and cards
ATM = A T M
POS = point of sale

# Accounts and transfers
IBAN = eye-ban
UAE PASS = U A E Pass
AECB = A E C B

# Money
AED = UAE dirhams
USD = US dollars
EUR = euros

# Words the agent should not use: replaced in the reply itself, so on screen as well as in speech.
# A term here is replaced wherever it appears, also inside a longer word (هنتحقق becomes هنتأكد).
[wording]
# Words the voice says wrongly: the bare word, then the same word with its diacritics. One Arabic word per
# line, no spaces, written without ال or a joined particle: مقدم also covers المقدم، والمقدم، بمقدم، للمقدم،
# كمقدم and the like. A plural or a form with an ending (مرتبات، مرتبك) is another word and needs its own
# line. If a joined form should sound different, give it its own line: it wins.

[diacritics]
بدقة = بِدِقَة
# الحد الأقصى: said الأءصى
أقصى = أَقْصَى
# Corrected by ear: income (not the verb دَخَل), the cash machine, and "I will send you"
دخل = دَخْلْ
الصراف = الصَرَّاف
صراف = صَرَّاف
هبعتلك = هَبْعتلَكْ
بعتلك = بَعَتْلّكْ

# Banking words that are spelled like another word. Without vowels the voice picks one of the two, not
# always the same one: مقدم came out as مُقَدِّم (the one who presents) instead of مُقَدَّم (the down payment).
# Paid, set, registered: the مُفَعَّل words
مقدم = مُقَدَّم
مقدما = مُقَدَّمًا
مرتب = مُرَتَّب
مرتبات = مُرَتَّبَات
مرتبك = مُرَتَّبَك
مرتبي = مُرَتَّبِي
مسجل = مُسَجَّل
مصرح = مُصَرَّح
موظف = مُوَظَّف
موظفين = مُوَظَّفِين
محدد = مُحَدَّد
محددة = مُحَدَّدَة
معجل = مُعَجَّل
معتمد = مُعْتَمَد
معتمدة = مُعْتَمَدَة
مستند = مُسْتَنَد
مستندات = مُسْتَنَدَات
مستخرج = مُسْتَخْرَج
مستحق = مُسْتَحَقّ
مستحقة = مُسْتَحَقَّة
مستحقات = مُسْتَحَقَّات
مدخرات = مُدَّخَرَات
مرتدة = مُرْتَدَّة
# Nouns spelled like a verb
قسط = قِسْط
أقساط = أَقْسَاط
قرض = قَرْض
قروض = قُرُوض
خصم = خَصْم
سحب = سَحْب
صرف = صَرْف
كشف = كَشْف
حد = حَدّ
سعر = سِعْر
رسوم = رُسُوم
عمولة = عُمُولَة
عملة = عُمْلَة
نسبة = نِسْبَة
ضمان = ضَمَان
مبلغ = مَبْلَغ
مدة = مُدَّة
مدين = مَدِين
فرع = فَرْع
فروع = فُرُوع
سنة = سَنَة
الدخل = الدَّخْلْ
# Verbs (البنك بيمول لحد 80%)
بيمول = بِيمَوِّل
يمول = يِمَوِّل
بنمول = بِنْمَوِّل
# Handing over (أحوّلك لحد من زمايلنا), as the agent may spell it
احولك = أَحَوِّلَك
أحولك = أَحَوِّلَك
هحولك = هَحَوِّلَك
# The assistant itself (أنا مساعد آلي). مساعدة is left out: it is also "help", مُسَاعَدَة
مساعد = مُسَاعِد
# الرقم القومي: picked by ear out of eight spellings. It sounded right with no vowels at all, on the exact
# voice setting (see [careful]), so each word is listed as itself: that keeps other vowels off it.
# (قومي was أَوْمِي here before.) The forms with ال come first so that والرقم، بالرقم follow them.
الرقم = الرقم
القومي = القومي
رقم = رقم
قومي = قومي
# بطاقة رقم قومي سارية: picked by ear with no vowels on any of its words, on the exact setting. سارية was
# سَارِيَة here before; it is now left without vowels and listed in [careful]. بطاقة is not listed either.
# Picked by ear
موبايلك = مُوبَايلَك
# الحسابات المتاحة: without vowels on the fast setting المتاحة came out as "المحاها". Picked with these vowels
# and on the exact setting (متاحة is in [careful]).
حسابات = حِسَابَات
متاحة = مُتَاحَة
# الكارت اللي آخره 1322: picked by ear with a short first vowel. آخرها follows the same pattern and was not
# picked from clips.
آخره = أَخْرُه
اخره = أَخْرُه
آخرها = أَخِرْهَا
اخرها = أَخِرْهَا
# كارت: picked by ear out of sixteen clips with no vowels, on the exact setting (it is in [careful]) and at the
# voice's pace of 0.8 (TTS_SPEED).
# توقف (عايز توقف أي كارت) is left out on purpose: of eight spellings, the one that sounded right was the
# word as the voice reads it unaided, on the fast setting.

# Words that also need the slower, more exact voice setting: with the fast one their vowels alone did not
# fix them (بدقة was said بدءة). One word per line; a sentence that holds one takes about five times as long
# to speak, so keep this list short.
[careful]
بدقة
أقصى
رقم
قومي
متاحة
سارية
كارت
