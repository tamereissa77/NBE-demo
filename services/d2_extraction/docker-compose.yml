# Stand-alone start of the D2 extraction service, for the machine that holds the GPU and the Chandra model
# (the GB10) when D2 itself runs somewhere else. This folder is all that is needed there.
#
#   cd services/d2_extraction
#   MODELS_DIR=/opt/models docker compose up -d --build     # the model is in $MODELS_DIR/chandra-ocr-2
#   curl -s localhost:8010/health                           # "model_loaded": true when ready
#   docker compose down                                     # frees the GPU memory
#
# Settings (environment or a .env file beside this one):
#   MODELS_DIR             folder that contains chandra-ocr-2/            default /opt/models
#   D2_EXTRACT_PORT        port published on this machine                 default 8010
#   D2_EXTRACTION_TOKEN    if set, callers must send it as a bearer token default: none
#   D2_LOAD_IN_4BIT        1 = 4-bit through bitsandbytes (as nbe-working); 0 = bfloat16, more memory
#   D2_EXTRACT_BASE_IMAGE, D2_EXTRACT_TORCH_INDEX   see the Dockerfile; only if the default build has no GPU torch

services:
  d2-extract:
    build:
      context: .
      args:
        BASE_IMAGE: ${D2_EXTRACT_BASE_IMAGE:-nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04}
        TORCH_INDEX: ${D2_EXTRACT_TORCH_INDEX:-}
    image: nbe-d2-extract:latest
    container_name: nbe-d2-extract
    restart: "no"
    ports:
      - "${D2_EXTRACT_PORT:-8010}:8000"
    environment:
      CHANDRA_MODEL_PATH: /models/chandra-ocr-2
      MAX_INFERENCE_DIM: ${D2_MAX_INFERENCE_DIM:-2000}
      LOAD_IN_4BIT: ${D2_LOAD_IN_4BIT:-1}
      EXTRACTION_TOKEN: ${D2_EXTRACTION_TOKEN:-}
      DATA_DIR: /work
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - d2-extract-work:/work
      - ${MODELS_DIR:-/opt/models}/chandra-ocr-2:/models/chandra-ocr-2:ro
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 80
      start_period: 600s

volumes:
  d2-extract-work:
