[project]
name = "nbe_core"
version = "0.3.0"
description = "Shared library for the NBE GB10 demos: settings, app factory, audit log, clients"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nbe_core"]
