# Banking guardrails for customer-facing demos (D4 virtual agent, D7 reply drafts).
# The LLM is the workhorse alias via the internal model gateway; the key comes from OPENAI_API_KEY.
models:
  - type: main
    engine: openai
    model: workhorse
    parameters:
      base_url: http://nbe-llmgw:4000/v1
      temperature: 0

rails:
  input:
    flows:
      - self check input
  output:
    flows:
      - self check output
