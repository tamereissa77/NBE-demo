# Workstation override: run the demos on a single-GPU PC instead of the GB10.
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d ...   (scripts/up_local.sh does this)
#
# What changes from the GB10 build:
#   - The LLM is hosted (config/litellm.local.yaml), so the model gateway alone gets a route out.
#     Every other container stays on the internal network.
#   - Embeddings and the reranker come from the local model store (MODELS_DIR) through nbe-retrieval,
#     which answers under the names of the GB10's vLLM servers. The `core` profile is not started.
#   - D4 speaks with VoiceTut-TTS (nbe-voicetut) and listens with QwenCleo-ASR (nbe-qwencleo), both
#     built for Egyptian Arabic with English mixed in, instead of Piper and whisper-large-v3.
#   - D1 reads uploaded documents with a fine-tuned Qwen3-VL (nbe-docvlm) on this machine, not with the
#     hosted LLM.
# The three GPU services share one image recipe (docker/local-gpu), so PyTorch and CUDA are stored once.
# They use restart "no", as on the GB10: they never take GPU memory at boot on a shared box.

x-local-gpu: &local-gpu
  restart: "no"
  volumes:
    - ${MODELS_DIR:-/opt/models}:/models:ro
  deploy:
    resources:
      reservations:
        devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 15s
    timeout: 5s
    retries: 20
    start_period: 180s

services:
  nbe-llmgw:
    environment:
      # Checked by scripts/up_local.sh, not required here: docker-compose.gb10.yml extends services of this file
      # on a machine that has no hosted model and no key
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ./config/litellm.local.yaml:/app/config.yaml:ro
    networks: [nbe-core, nbe-edge]

  # bge-m3 + bge-reranker-v2-m3 (measured: reranking 10 passages takes 3 s on CPU)
  nbe-retrieval:
    <<: *local-gpu
    build:
      context: .
      dockerfile: docker/local-gpu/Dockerfile
      args: { SERVICE: embed, BASE: "${NBE_GPU_BASE:-python:3.12-slim}" }
    image: nbe-retrieval:${IMAGE_TAG:-latest}
    container_name: nbe-retrieval
    environment:
      RETRIEVAL_DEVICE: ${NBE_RETRIEVAL_DEVICE:-cuda}
    networks:
      nbe-core:
        aliases: [nbe-embed, nbe-rerank]

  # Voice out for D4: VoiceTut-TTS, answering as the GB10's Piper service (nbe-tts)
  nbe-voicetut:
    <<: *local-gpu
    build:
      context: .
      dockerfile: docker/local-gpu/Dockerfile
      args: { SERVICE: tts_voicetut, BASE: "${NBE_GPU_BASE:-python:3.12-slim}" }
    image: nbe-voicetut:${IMAGE_TAG:-latest}
    container_name: nbe-voicetut
    environment:
      TTS_DEVICE: ${NBE_TTS_DEVICE:-cuda}
      TTS_SPEAKER: ${NBE_TTS_SPEAKER:-Hanan}
      HF_HUB_CACHE: /models
    networks:
      nbe-core:
        aliases: [nbe-tts]

  # Voice in for D4: QwenCleo-ASR, answering as the GB10's ASR service (nbe-asr).
  # It runs in the image's second Python environment (transformers 4.57, see docker/local-gpu/Dockerfile).
  nbe-qwencleo:
    <<: *local-gpu
    build:
      context: .
      dockerfile: docker/local-gpu/Dockerfile
      args: { SERVICE: asr_qwencleo, BASE: "${NBE_GPU_BASE:-python:3.12-slim}" }
    image: nbe-qwencleo:${IMAGE_TAG:-latest}
    container_name: nbe-qwencleo
    command: ["/opt/asr/bin/python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ASR_DEVICE: ${NBE_ASR_DEVICE:-cuda:0}
      ASR_AUTO_LANGUAGE: ${NBE_ASR_AUTO_LANGUAGE-Arabic}
    networks:
      nbe-core:
        aliases: [nbe-asr]

  # Document reading for D1: Qwen3-VL-8B with the fine-tuned LoRA adapter (v18), served by the project that
  # trained and measured it (NBE_DOCVLM_REPO, mounted read-only), so the prompts, image sizing and number
  # checks are the measured ones. It runs in the shared GPU image; the packages that image lacks come from a
  # folder on the host (scripts/docvlm_libs.sh), so nothing is built. About 17.5 GB of GPU memory.
  # Real documents are read here and nowhere else: this service has no route out.
  nbe-docvlm:
    <<: *local-gpu
    image: nbe-retrieval:${IMAGE_TAG:-latest}
    container_name: nbe-docvlm
    working_dir: /app
    command: ["/opt/asr/bin/python", "nbe_finetune/demo/api.py"]
    environment:
      VISION_API_HOST: 0.0.0.0
      VISION_API_PORT: "8000"
      VISION_ADAPTER_DIR: /app/nbe_finetune/output/candidates/${NBE_DOCVLM_ADAPTER:-v18}
      # The settings the adapter was measured with: every trained type is read with the adapter, and
      # stamp and signature are asked for
      TRAINED_DOC_TYPES: bank_statement,birth_certificate,clinic_license,commercial_register,driving_license,electricity_bill,hr_letter,id_back,id_front,marriage_certificate,ownership_contract,pension_transfer_pledge,practice_license,salary_transfer_pledge,syndicate_card,tax_card,utility_bill,vat_certificate
      VISION_ASK_MARKS: "1"
      HF_HUB_CACHE: /models
      LOAN_DEVICE: cuda:0
    # Under WSL every GPU memory block is a file handle. The model is loaded tensor by tensor, and with the
    # default limit of 1024 the adapter failed to load with "CUDA driver error: unknown error".
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - ${MODELS_DIR:-/opt/models}:/models:ro
      - ${NBE_DOCVLM_REPO:-./ops/docvlm-repo}/nbe_finetune:/app/nbe_finetune:ro
      - ${NBE_DOCVLM_LIBS:-./ops/docvlm-libs}:/app/.qwen3-libs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 600s      # 9 GB of weights are read and expanded before the API answers
    networks: [nbe-core]

  nbe-d1:
    environment:
      DOCVLM_URL: http://nbe-docvlm:8000
