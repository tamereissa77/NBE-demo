# Workstation override: run the demos on a single-GPU PC instead of the GB10.
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d ...   (scripts/up_local.sh does this)
#
# What changes from the GB10 build:
#   - The LLM is hosted (config/litellm.local.yaml), so the model gateway alone gets a route out.
#     Every other container stays on the internal network.
#   - Embeddings and the reranker come from the local model store (MODELS_DIR) through nbe-retrieval,
#     which answers under the names of the GB10's vLLM servers. The `core` profile is not started.
#   - D4 speaks with VoiceTut-TTS (nbe-voicetut) and listens with QwenCleo-ASR (nbe-qwencleo), both
#     built for Egyptian Arabic with English mixed in, instead of Piper and whisper-large-v3.
# The three GPU services share one image recipe (docker/local-gpu), so PyTorch and CUDA are stored once.
# They use restart "no", as on the GB10: they never take GPU memory at boot on a shared box.

x-local-gpu: &local-gpu
  restart: "no"
  volumes:
    - ${MODELS_DIR:-/opt/models}:/models:ro
  deploy:
    resources:
      reservations:
        devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 15s
    timeout: 5s
    retries: 20
    start_period: 180s

services:
  nbe-llmgw:
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
    volumes:
      - ./config/litellm.local.yaml:/app/config.yaml:ro
    networks: [nbe-core, nbe-edge]

  # bge-m3 + bge-reranker-v2-m3 (measured: reranking 10 passages takes 3 s on CPU)
  nbe-retrieval:
    <<: *local-gpu
    build:
      context: .
      dockerfile: docker/local-gpu/Dockerfile
      args: { SERVICE: embed, BASE: "${NBE_GPU_BASE:-python:3.12-slim}" }
    image: nbe-retrieval:latest
    container_name: nbe-retrieval
    environment:
      RETRIEVAL_DEVICE: ${NBE_RETRIEVAL_DEVICE:-cuda}
    networks:
      nbe-core:
        aliases: [nbe-embed, nbe-rerank]

  # Voice out for D4: VoiceTut-TTS, answering as the GB10's Piper service (nbe-tts)
  nbe-voicetut:
    <<: *local-gpu
    build:
      context: .
      dockerfile: docker/local-gpu/Dockerfile
      args: { SERVICE: tts_voicetut, BASE: "${NBE_GPU_BASE:-python:3.12-slim}" }
    image: nbe-voicetut:latest
    container_name: nbe-voicetut
    environment:
      TTS_DEVICE: ${NBE_TTS_DEVICE:-cuda}
      TTS_SPEAKER: ${NBE_TTS_SPEAKER:-Hanan}
      HF_HUB_CACHE: /models
    networks:
      nbe-core:
        aliases: [nbe-tts]

  # Voice in for D4: QwenCleo-ASR, answering as the GB10's ASR service (nbe-asr).
  # It runs in the image's second Python environment (transformers 4.57, see docker/local-gpu/Dockerfile).
  nbe-qwencleo:
    <<: *local-gpu
    build:
      context: .
      dockerfile: docker/local-gpu/Dockerfile
      args: { SERVICE: asr_qwencleo, BASE: "${NBE_GPU_BASE:-python:3.12-slim}" }
    image: nbe-qwencleo:latest
    container_name: nbe-qwencleo
    command: ["/opt/asr/bin/python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ASR_DEVICE: ${NBE_ASR_DEVICE:-cuda:0}
      ASR_AUTO_LANGUAGE: ${NBE_ASR_AUTO_LANGUAGE-Arabic}
    networks:
      nbe-core:
        aliases: [nbe-asr]
