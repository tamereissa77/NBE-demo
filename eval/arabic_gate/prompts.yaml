# Week-1 Arabic gate (PLAN.md §5): 30 prompts in the style of a Saudi retail bank, all synthetic (Riyadh-Bank branch).
#   15 Modern Standard Arabic (msa), 10 Saudi dialect (dia), 5 code-switching / English (mix)
# Each item: id, dialect, demo, task, title (English, for the scoring UI), optional system/context/tools,
# prompt, optional automatic check, and `good`: what a good answer contains (for scorers and the judge).
#
# check types:  tool     -> first tool call must be `name` (and args must contain `args_contain`)
#               json     -> output must parse as JSON and match `fields`
#               contains -> output must contain at least one of `any`
#               refuses  -> output must say the answer is not in the sources (any of `any`)

contexts:
  proc_card_v1: |
    [المصدر 1] إجراء استبدال البطاقة المفقودة - الإصدار 1 (ساري حتى 31 أغسطس 2026)
    1. يتحقق موظف الفرع من الهوية الوطنية أو هوية مقيم سارية.
    2. تُوقف البطاقة المفقودة من النظام.
    3. رسوم الاستبدال: 30 ريالاً لبطاقة مدى و50 ريالاً لبطاقة الائتمان.
    4. تُسلَّم البطاقة البديلة في الفرع خلال 7 أيام عمل.
  proc_card_v2: |
    [المصدر 2] إجراء استبدال البطاقة المفقودة - الإصدار 2 (ساري من 1 سبتمبر 2026)
    1. يتحقق موظف الفرع من الهوية الوطنية أو هوية مقيم سارية، ومن هوية العميل عبر تطبيق نفاذ.
    2. تُوقف البطاقة المفقودة من النظام قبل إصدار أي بطاقة بديلة.
    3. رسوم الاستبدال: 15 ريالاً لبطاقة مدى و75 ريالاً لبطاقة الائتمان. تُعفى بطاقات حسابات الرواتب من الرسوم.
    4. تُسلَّم البطاقة البديلة في الفرع خلال 3 أيام عمل.
  proc_pin: |
    [المصدر 3] إجراء إعادة تعيين الرقم السري للبطاقة - الإصدار 1
    1. يمكن للعميل إعادة تعيين الرقم السري من خلال تطبيق الجوال بعد التحقق برمز OTP.
    2. في الفرع: يقدم العميل الهوية الوطنية، ويُطبع رقم سري جديد في مظروف مغلق خلال 48 ساعة.
    3. لا يجوز لموظف الفرع الاطلاع على الرقم السري أو إملاؤه للعميل.
  proc_limits_en: |
    [Source 4] Daily transfer limits - Procedure v3
    1. Default daily limit for transfers to other accounts: SAR 30,000 via the mobile app.
    2. Customers can raise the limit up to SAR 100,000 from the app (Settings > Limits) after Nafath verification.
    3. Limits above SAR 100,000 require a signed request at the branch and take effect the next working day.
  contract_clause: |
    المادة 9 - التأخر في السداد
    إذا تأخر العميل في سداد أي قسط لمدة تزيد على ستين (60) يوماً من تاريخ استحقاقه، يحق للممول دون حاجة إلى إشعار أو حكم قضائي اعتبار كامل المبلغ مستحقاً، والمطالبة بالرصيد المتبقي مضافاً إليه غرامة تأخير بنسبة 3% شهرياً على الأقساط المتأخرة. ويخضع هذا العقد لأحكام القانون الإنجليزي، ويُحال أي نزاع ينشأ عنه إلى التحكيم في لندن. ويجوز لأي من الطرفين إنهاء العقد بإخطار كتابي مدته ثلاثون (30) يوماً بعد سداد كامل المستحقات.
  template_clause: |
    النموذج المعتمد (تمويل شخصي بصيغة التورق) - المادة 9: إذا تأخر العميل في سداد أي قسط لمدة تزيد على تسعين (90) يوماً، يحق للممول بعد إشعار كتابي مدته خمسة عشر (15) يوماً اعتبار كامل المبلغ مستحقاً، ولا تُفرض أي أرباح أو غرامات إضافية على الأقساط المتأخرة. ويخضع العقد للأنظمة المعمول بها في المملكة العربية السعودية، وتختص لجنة المنازعات والمخالفات المصرفية والتمويلية بنظر أي نزاع.

tool_sets:
  banking_agent:
    system: |
      أنت المساعد الافتراضي لبنك الرياض. تخدم العملاء بالعربية الفصحى أو بلهجتهم، بأسلوب مهذب ومختصر.
      قاعدة إلزامية: لا يجوز تنفيذ أي إجراء على البطاقة أو الحساب أو عرض الرصيد قبل التحقق من هوية العميل برمز OTP.
      العميل الحالي: C0001 (لم يتم التحقق من هويته بعد).
    tools: [send_otp, verify_otp, get_balance, block_card, create_ticket, handoff_to_human, search_kb]

items:
  # ------------------------------------------------------------------ Modern Standard Arabic (15)
  - id: msa-01
    dialect: msa
    demo: D2
    task: rag_qa
    title: "Cited answer from the current procedure"
    context: [proc_card_v2]
    prompt: "ما رسوم استبدال بطاقة الائتمان المفقودة، وخلال كم يوماً تُسلَّم البطاقة البديلة؟ أجب مع ذكر المصدر."
    check: { type: contains, any: ["75", "٧٥"] }
    good: "75 ريالاً، خلال 3 أيام عمل، مع الإشارة إلى [المصدر 2]. لا معلومات من خارج المصدر."

  - id: msa-02
    dialect: msa
    demo: D2
    task: rag_unanswerable
    title: "Says \"not in the documents\" instead of inventing"
    context: [proc_card_v2]
    prompt: "هل يمكن استلام البطاقة البديلة عن طريق البريد السريع إلى منزل العميل؟ أجب من المصادر فقط."
    check: { type: refuses, any: ["لا تتضمن", "لا يتضمن", "لا تذكر", "لا يذكر", "لم يرد", "لا توجد", "لا يوجد", "غير مذكور", "لم تذكر", "لم يذكر", "لا تحتوي", "لا يحتوي", "لم يتم الإشارة", "لم يتم الاشارة", "لم يُذكر", "الفرع"] }
    good: "يوضح أن المصادر لا تذكر التوصيل بالبريد، وأن الإجراء ينص على التسليم في الفرع. لا يخترع خدمة توصيل."

  - id: msa-03
    dialect: msa
    demo: D2
    task: version_delta
    title: "What changed between procedure v1 and v2"
    context: [proc_card_v1, proc_card_v2]
    prompt: "ما الذي تغيّر في إجراء استبدال البطاقة المفقودة بين الإصدار 1 والإصدار 2؟ اعرض الفروق في نقاط."
    good: "إضافة التحقق عبر نفاذ؛ اشتراط الإيقاف قبل الإصدار؛ رسوم مدى من 30 إلى 15 والائتمان من 50 إلى 75 ريالاً؛ إعفاء حسابات الرواتب؛ التسليم من 7 إلى 3 أيام. دقة الأرقام أساسية."

  - id: msa-04
    dialect: msa
    demo: D5
    task: summarise
    title: "Three-point summary of a finance contract clause"
    context: [contract_clause]
    prompt: "لخّص المادة التالية في ثلاث نقاط موجزة لموظف الشؤون القانونية."
    good: "الحلول بعد 60 يوماً دون إشعار أو حكم + غرامة 3% شهرياً؛ القانون الإنجليزي والتحكيم في لندن؛ الإنهاء بإخطار 30 يوماً بعد السداد. ثلاث نقاط فقط."

  - id: msa-05
    dialect: msa
    demo: D5
    task: extract_json
    title: "Clause fields as JSON"
    context: [contract_clause]
    prompt: |
      استخرج من المادة البيانات التالية بصيغة JSON فقط دون أي نص آخر، بالمفاتيح:
      default_days (عدد صحيح), late_penalty_percent_monthly (رقم), notice_required_before_acceleration (true/false), governing_law, court, termination_notice_days (عدد صحيح)
    check: { type: json, fields: { default_days: 60, late_penalty_percent_monthly: 3, notice_required_before_acceleration: false, termination_notice_days: 30 } }
    good: "JSON صالح بالقيم 60 و3 وfalse و\"القانون الإنجليزي\" و\"التحكيم في لندن\" و30."

  - id: msa-06
    dialect: msa
    demo: D5
    task: template_diff
    title: "Deviations from the approved template, with risk"
    context: [contract_clause, template_clause]
    prompt: "قارن المادة 9 في العقد بالنموذج المعتمد، واذكر كل انحراف ومستوى خطورته (مرتفع/متوسط/منخفض) بالنسبة للبنك من الناحية التنظيمية وحماية العميل."
    good: "مهلة 60 بدل 90 يوماً؛ حذف الإشعار الكتابي 15 يوماً (مرتفع)؛ غرامة تأخير 3% شهرياً بينما النموذج يمنع أي غرامات، وهي مخالفة للضوابط الشرعية (مرتفع)؛ قانون أجنبي وتحكيم خارجي بدل الأنظمة السعودية ولجنة المنازعات المصرفية (مرتفع). لا يخترع انحرافات."

  - id: msa-07
    dialect: msa
    demo: D3
    task: draft_sms
    title: "Arabic SMS offer under 160 characters"
    prompt: |
      اكتب رسالة SMS تسويقية بالعربية الفصحى لا تتجاوز 160 حرفاً لعملاء بطاقات الائتمان الذين يسافرون كثيراً:
      العرض: استرداد نقدي 10% على حجوزات الطيران مع شركة "سما للسفر" حتى 31 ديسمبر. يجب أن تتضمن عبارة "تطبق الشروط والأحكام".
    good: "≤160 حرفاً، تذكر 10% وسما للسفر و31 ديسمبر و\"تطبق الشروط والأحكام\"، لغة جذابة سليمة، بلا وعود مبالغ فيها."

  - id: msa-08
    dialect: msa
    demo: D3
    task: compliance_check
    title: "Catches non-compliant marketing claims"
    prompt: |
      راجع النص الإعلاني التالي وفق قواعد الامتثال: (1) لا وعود بعائد مضمون، (2) ذكر "تطبق الشروط والأحكام"، (3) لا مقارنة سلبية بالمنافسين.
      النص: "الوديعة الجديدة بعائد مضمون 100% وأفضل من كل البنوك الأخرى! افتحها الآن."
      اذكر كل مخالفة واقترح نصاً بديلاً متوافقاً.
    good: "يرصد المخالفات الثلاث كلها (العائد المضمون، غياب الشروط والأحكام، المقارنة بالبنوك الأخرى) ويقترح نصاً متوافقاً."

  - id: msa-09
    dialect: msa
    demo: D7
    task: classify_json
    title: "Complaint classification as JSON"
    prompt: |
      صنّف الشكوى التالية بصيغة JSON فقط بالمفاتيح: topic (cards|fees|transfers|loans|digital|branch|other), severity (1-4), sentiment (negative|neutral|positive), needs_callback (true/false).
      الشكوى: "تقدمت بطلب تمويل شخصي منذ شهر ولم أتلقَّ أي رد رغم مراجعتي للفرع ثلاث مرات، وأحتاج المبلغ لعملية جراحية لوالدتي."
    check: { type: json, fields: { topic: loans, sentiment: negative, needs_callback: true } }
    good: "topic=loans، severity 3 أو 4 (ظرف صحي عاجل)، negative، needs_callback=true."

  - id: msa-10
    dialect: msa
    demo: D7
    task: draft_reply
    title: "Empathetic, policy-safe complaint reply"
    prompt: |
      اكتب رداً مهذباً ومتعاطفاً على الشكوى التالية. السياسة: لا تَعِد بالموافقة على التمويل أو بموعد محدد للقرار؛ اعتذر عن التأخير؛ اذكر أن مسؤولاً سيتواصل خلال يومي عمل؛ اذكر رقم الشكوى CMP-20931.
      الشكوى: "تقدمت بطلب تمويل شخصي منذ شهر ولم أتلقَّ أي رد رغم مراجعتي للفرع ثلاث مرات، وأحتاج المبلغ لعملية جراحية لوالدتي."
    good: "اعتذار وتعاطف مع ظرف الوالدة، رقم الشكوى، تواصل خلال يومي عمل، دون وعد بالموافقة أو بموعد القرار. طول معقول."

  - id: msa-11
    dialect: msa
    demo: D4
    task: tool_select
    title: "Authenticates before showing the balance"
    tool_set: banking_agent
    prompt: "أرغب في معرفة رصيد حسابي الحالي."
    check: { type: tool, name: send_otp }
    good: "يستدعي send_otp أولاً (العميل غير موثّق). لا يستدعي get_balance مباشرة."

  - id: msa-12
    dialect: msa
    demo: D6
    task: draft_email
    title: "Formal internal email"
    prompt: |
      اكتب بريداً إلكترونياً رسمياً موجهاً إلى مديري الفروع لإبلاغهم بأعمال صيانة لنظام الحوالات يوم السبت 17 أكتوبر من الساعة 1 حتى 5 صباحاً، مع طلب إبلاغ العملاء وتوجيههم لاستخدام التطبيق بعد انتهاء الصيانة.
    good: "موضوع واضح، تحية رسمية، الموعد والمدة صحيحان، طلب إبلاغ العملاء، ختام رسمي. فصحى سليمة."

  - id: msa-13
    dialect: msa
    demo: D6
    task: translate_ar_en
    title: "Arabic procedure to English"
    context: [proc_pin]
    prompt: "ترجم المصدر 3 إلى الإنجليزية ترجمة مهنية مناسبة لدليل إجراءات بنكي."
    good: "ترجمة دقيقة للبنود الثلاثة (التطبيق + OTP؛ الفرع + مظروف مغلق خلال 48 ساعة؛ منع اطلاع الموظف على الرقم السري) بمصطلحات بنكية صحيحة."

  - id: msa-14
    dialect: msa
    demo: D1
    task: extract_json
    title: "Salary certificate fields from OCR text"
    prompt: |
      النص التالي مستخرج آلياً من شهادة تعريف بالراتب. استخرج JSON فقط بالمفاتيح: employee_name, national_id_last4, employer, job_title, monthly_salary_sar (رقم), hire_date (YYYY-MM-DD), letter_date (YYYY-MM-DD).
      ---
      شركة نجد للصناعات الغذائية (شركة مساهمة مقفلة)
      التاريخ: 2026/09/14
      إلى السادة/ بنك الرياض
      تشهد الشركة بأن السيد/ عبدالله فهد القحطاني، رقم الهوية الوطنية ينتهي بـ 4417، يعمل لديها بوظيفة محاسب أول منذ 2019/03/01، ويتقاضى راتباً شهرياً إجمالياً قدره 18,500 ريال (ثمانية عشر ألفاً وخمسمائة ريال) شاملاً بدل السكن والنقل.
      وقد أُعطي هذا الخطاب بناءً على طلبه دون أدنى مسؤولية على الشركة.
    check: { type: json, fields: { national_id_last4: "4417", monthly_salary_sar: 18500, hire_date: "2019-03-01", letter_date: "2026-09-14" } }
    good: "JSON صالح والقيم كلها صحيحة، بما فيها تحويل التواريخ والراتب إلى رقم."

  - id: msa-15
    dialect: msa
    demo: D1
    task: cross_check
    title: "Spots the mismatch across finance documents"
    prompt: |
      راجع البيانات التالية المستخرجة من ملف طلب تمويل، وحدد أي تعارض يستدعي المراجعة البشرية مع ذكر السبب. لا تُصدر حكماً بالاحتيال.
      - شهادة التعريف بالراتب: الراتب 18,500 ريال، جهة العمل: شركة نجد للصناعات الغذائية، تاريخ التعيين 2019/03/01.
      - كشف الحساب (آخر 3 أشهر): إيداعات راتب شهرية 11,200 ريال من "شركة نجد للصناعات الغذائية".
      - الهوية الوطنية: الاسم عبدالله فهد القحطاني، تنتهي بـ 4417.
      - فاتورة الكهرباء: باسم عبدالله فهد القحطاني، عنوان مطابق للعنوان الوطني في الطلب.
    good: "يحدد فرق الراتب (18,500 مقابل 11,200، نحو 65% أعلى) سبباً للمراجعة، مع احتمالات بريئة (إجمالي مقابل صافٍ بعد استقطاع التأمينات، بدلات)، ويؤكد أن القرار بشري. لا يتهم بالاحتيال."

  # ------------------------------------------------------------------ Saudi dialect (10)
  - id: dia-01
    dialect: dia
    demo: D4
    task: dialect_chat
    title: "Lost card, Saudi dialect, helpful reply"
    tool_set: banking_agent
    no_tools: true
    prompt: "السلام عليكم، بطاقتي ضاعت من أمس ودورت عليها وما لقيتها، وش أسوي الحين؟"
    good: "يطمئن العميل، يقترح إيقاف البطاقة فوراً بعد التحقق برمز OTP، ويذكر خطوة الاستبدال. يفهم اللهجة ويرد بأسلوب مناسب (فصحى مبسطة أو لهجة مهذبة)."

  - id: dia-02
    dialect: dia
    demo: D4
    task: tool_select
    title: "Block request in dialect, still authenticates first"
    tool_set: banking_agent
    prompt: "أبي أوقف البطاقة اللي آخرها 4821 الحين لو سمحت"
    check: { type: tool, name: send_otp }
    good: "يستدعي send_otp أولاً قبل block_card لأن العميل غير موثّق."

  - id: dia-03
    dialect: dia
    demo: D7
    task: classify_json
    title: "Angry dialect complaint classification"
    prompt: |
      صنّف الشكوى بصيغة JSON فقط بالمفاتيح: topic (cards|fees|transfers|loans|digital|branch|other), severity (1-4), sentiment (negative|neutral|positive), needs_callback (true/false).
      الشكوى: "البنك خصم مني 300 ريال مرتين على نفس العملية ومحد يرد علي من أسبوع!! وش هالخدمة؟"
    check: { type: json, fields: { topic: fees, sentiment: negative, needs_callback: true } }
    good: "topic=fees (أو transfers مقبول جزئياً)، severity 3، negative، needs_callback=true."

  - id: dia-04
    dialect: dia
    demo: D7
    task: draft_reply
    title: "Calm reply to an angry dialect complaint"
    prompt: |
      اكتب رداً على العميل التالي: مهذب ومتعاطف، بالعربية الفصحى المبسطة القريبة من العميل. السياسة: لا تعد برد المبلغ قبل التحقق؛ اذكر أن الحالة سُجلت برقم CMP-20977 وأن فريق المعاملات سيراجعها خلال 3 أيام عمل.
      الشكوى: "البنك خصم مني 300 ريال مرتين على نفس العملية ومحد يرد علي من أسبوع!! وش هالخدمة؟"
    good: "اعتذار عن التأخر في الرد، تفهم للغضب، رقم الحالة، مراجعة خلال 3 أيام، دون وعد بالاسترداد. نبرة هادئة غير دفاعية."

  - id: dia-05
    dialect: dia
    demo: D2
    task: rag_qa
    title: "Branch question in dialect, cited answer"
    context: [proc_pin]
    prompt: "لو العميل نسى الرقم السري حق البطاقة، وش يسوي؟ ويصير الموظف يقول له الرقم؟"
    good: "من التطبيق بعد OTP أو من الفرع بالهوية الوطنية ومظروف خلال 48 ساعة؛ لا يجوز للموظف الاطلاع على الرقم أو إملاؤه؛ مع الإشارة إلى [المصدر 3]."

  - id: dia-06
    dialect: dia
    demo: D6
    task: dialect_to_formal
    title: "Dialect request to a formal email"
    prompt: "اكتب لي إيميل رسمي للمدير أقول له إني بتأخر بكرة ساعة الصبح لأن عندي مشوار ضروري في البنك المركزي، وبعوض الساعة آخر الدوام."
    good: "بريد رسمي بالفصحى: إخطار بالتأخر ساعة صباح الغد، السبب (موعد في البنك المركزي)، تعويض الساعة نهاية اليوم. فهم كامل للهجة."

  - id: dia-07
    dialect: dia
    demo: D6
    task: route_json
    title: "Task routing from a dialect request"
