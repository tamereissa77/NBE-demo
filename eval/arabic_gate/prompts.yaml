  - id: mix-04
    dialect: mix
    demo: D6
    task: code_explain
    title: "Explain Python code in Arabic"
    prompt: |
      اشرح لي هالكود بالعربي باختصار، وقل لي إذا فيه مشكلة:
      ```python
      def monthly_installment(principal, annual_rate, months):
          r = annual_rate / 12
          return principal * r / (1 - (1 + r) ** -months)
      ```
    good: "يشرح أنه يحسب القسط الشهري لتمويل بمعادلة الاستهلاك؛ ينبّه إلى القسمة على صفر عند annual_rate=0 وأن المعدل يجب أن يكون كسراً (0.2 لا 20). مصطلحات تقنية واضحة."

